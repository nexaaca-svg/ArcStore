                            &lt;span class=&quot;text-xl font-black text-emerald-400&quot;&gt;${formattedPrice}&lt;/span&gt;
                            &lt;span class=&quot;text-xs text-slate-500 line-through&quot;&gt;${formattedOldPrice}&lt;/span&gt;
                        &lt;/div&gt;

                        &lt;div class=&quot;grid grid-cols-2 gap-2&quot;&gt;
                            &lt;button onclick=&quot;openProductModal(&#39;${item.id}&#39;)&quot; class=&quot;w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-slate-200 text-xs font-bold transition-colors flex items-center justify-center gap-1&quot;&gt;
                                &lt;i class=&quot;fa-solid fa-circle-info&quot;&gt;&lt;/i&gt; Detail
                            &lt;/button&gt;
                            &lt;button onclick=&quot;openProductModal(&#39;${item.id}&#39;)&quot; class=&quot;w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-extrabold transition-all glow-wa flex items-center justify-center gap-1.5&quot;&gt;
                                &lt;i class=&quot;fa-brands fa-whatsapp text-sm&quot;&gt;&lt;/i&gt; Order
                            &lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
                grid.appendChild(card);
            });
        }

        // Live Filter and Search Logic
        function filterProducts() {
            const query = document.getElementById(&#39;searchInput&#39;).value.toLowerCase().trim();
            const sortBy = document.getElementById(&#39;sortSelect&#39;).value;

            let filtered = products.filter(p =&gt; {
                const matchCategory = currentCategory === &#39;all&#39; || p.category === currentCategory;
                const matchPlatform = currentPlatform === &#39;all&#39; || p.platform.toLowerCase().includes(currentPlatform.toLowerCase());
                const matchQuery = p.title.toLowerCase().includes(query) || 
                                   p.platform.toLowerCase().includes(query) || 
                                   p.specs.some(s =&gt; s.toLowerCase().includes(query));
                return matchCategory &amp;&amp; matchPlatform &amp;&amp; matchQuery;
            });

            // Sorting
            if (sortBy === &#39;termurah&#39;) {
                filtered.sort((a, b) =&gt; a.price - b.price);
            } else if (sortBy === &#39;termahal&#39;) {
                filtered.sort((a, b) =&gt; b.price - a.price);
            } else if (sortBy === &#39;nama&#39;) {
                filtered.sort((a, b) =&gt; a.title.localeCompare(b.title));
            } else if (sortBy === &#39;populer&#39;) {
                filtered.sort((a, b) =&gt; (b.popular ? 1 : 0) - (a.popular ? 1 : 0));
            }

            renderProducts(filtered);
        }

        // Set Active Category Tab
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll(&#39;.cat-btn&#39;).forEach(btn =&gt; {
                btn.className = &quot;cat-btn px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm whitespace-nowrap bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition-all&quot;;
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = &quot;cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm whitespace-nowrap bg-brand-600 text-white shadow-md shadow-brand-500/20 transition-all&quot;;
            }
            filterProducts();
        }

        // Set Active Platform Pill
        function setPlatform(plat) {
            currentPlatform = plat;
            document.querySelectorAll(&#39;.plat-pill&#39;).forEach(btn =&gt; {
                btn.className = &quot;plat-pill px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition-all&quot;;
            });
            
            // Highlight specific active pill
            let safeId = plat.replace(/[^a-zA-Z0-9]/g, &#39;&#39;);
            if (plat === &#39;Shopee / Tokopedia&#39;) safeId = &#39;Shopee&#39;;
            if (plat === &#39;X (Twitter)&#39;) safeId = &#39;Twitter&#39;;
            
            const activePill = document.getElementById(`plat-${safeId}`);
            if (activePill) {
                activePill.className = &quot;plat-pill px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-brand-500/20 text-brand-300 border border-brand-500/40 transition-all&quot;;
            }
            filterProducts();
        }

        // Modal Order Controls
        function openProductModal(productId) {
            const product = products.find(p =&gt; p.id === productId);
            if (!product) return;

            currentModalProduct = product;
            currentMultiplier = 1;
            updateMultiplierBtns();

            document.getElementById(&#39;modalTargetInput&#39;).value = &#39;&#39;;
            document.getElementById(&#39;modalNote&#39;).value = &#39;&#39;;

            document.getElementById(&#39;modalTitle&#39;).textContent = product.title;
            document.getElementById(&#39;modalCategory&#39;).textContent = product.platform;
            document.getElementById(&#39;modalStock&#39;).textContent = product.badge;

            const formattedPrice = new Intl.NumberFormat(&#39;id-ID&#39;, { style: &#39;currency&#39;, currency: &#39;IDR&#39;, maximumFractionDigits: 0 }).format(product.price);
            document.getElementById(&#39;modalPrice&#39;).textContent = formattedPrice;

            // Icon &amp; colors
            const iconBox = document.getElementById(&#39;modalIconContainer&#39;);
            iconBox.className = `w-14 h-14 rounded-2xl bg-gradient-to-br ${product.brandColor} flex items-center justify-center text-2xl text-white shadow-lg`;
            document.getElementById(&#39;modalIcon&#39;).className = product.icon;

            // Specs bullet points
            const specsContainer = document.getElementById(&#39;modalSpecs&#39;);
            specsContainer.innerHTML = product.specs.map(spec =&gt; `
                &lt;li class=&quot;flex items-start gap-2&quot;&gt;
                    &lt;i class=&quot;fa-solid fa-circle-check text-emerald-400 text-xs mt-0.5&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;${spec}&lt;/span&gt;
                &lt;/li&gt;
            `).join(&#39;&#39;);

            recalculateTotalPrice();
            document.getElementById(&#39;productModal&#39;).classList.remove(&#39;hidden&#39;);
        }

        function closeProductModal() {
            document.getElementById(&#39;productModal&#39;).classList.add(&#39;hidden&#39;);
            currentModalProduct = null;
        }

        function setMultiplier(val) {
            currentMultiplier = val;
            updateMultiplierBtns();
            recalculateTotalPrice();
        }

        function updateMultiplierBtns() {
            document.querySelectorAll(&#39;.mult-btn&#39;).forEach(btn =&gt; {
                btn.className = &quot;mult-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700&quot;;
            });
            const activeBtn = Array.from(document.querySelectorAll(&#39;.mult-btn&#39;)).find(b =&gt; b.textContent === `${currentMultiplier}x`);
            if (activeBtn) {
                activeBtn.className = &quot;mult-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-brand-600 text-white shadow-md shadow-brand-500/30&quot;;
            }
        }

        function recalculateTotalPrice() {
            if (!currentModalProduct) return;
            const total = currentModalProduct.price * currentMultiplier;
            const formattedTotal = new Intl.NumberFormat(&#39;id-ID&#39;, { style: &#39;currency&#39;, currency: &#39;IDR&#39;, maximumFractionDigits: 0 }).format(total);
            document.getElementById(&#39;modalTotalPrice&#39;).textContent = formattedTotal;
        }

        // WhatsApp Order Link Generator
        function sendOrderToWA() {
            if (!currentModalProduct) return;

            const targetInput = document.getElementById(&#39;modalTargetInput&#39;).value.trim();
            if (!targetInput) {
                showToast(&#39;⚠️ Mohon isi Target Link / Username Public terlebih dahulu!&#39;);
                document.getElementById(&#39;modalTargetInput&#39;).focus();
                return;
            }

            const note = document.getElementById(&#39;modalNote&#39;).value.trim();
            const total = currentModalProduct.price * currentMultiplier;
            const formattedTotal = new Intl.NumberFormat(&#39;id-ID&#39;, { style: &#39;currency&#39;, currency: &#39;IDR&#39;, maximumFractionDigits: 0 }).format(total);

            const message = 
`Halo Admin ARSTORE, saya mau order via Website Official:

📦 *LAYANAN:* ${currentModalProduct.title}
🏷️ *KODE SMM:* ${currentModalProduct.id}
🎯 *TARGET (USER/LINK):* ${targetInput}
🔢 *KELIPATAN:* ${currentMultiplier}x Paket
💵 *TOTAL HARGA:* ${formattedTotal}
${note ? `📝 *CATATAN:* ${note}\n` : &#39;&#39;}
Mohon kirimkan metode pembayaran (QRIS / DANA / Bank BCA). Terima kasih!`;

            const url = `https://wa.me/${adminConfig.waNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, &#39;_blank&#39;);
            closeProductModal();
        }

        function contactGeneralWA(topic = &#39;Konsultasi Layanan ARSTORE&#39;) {
            const message = `Halo Admin ARSTORE, saya mau ${topic}. Mohon bantuannya!`;
            const url = `https://wa.me/${adminConfig.waNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, &#39;_blank&#39;);
        }

        // Admin Config Modal Controls
        function openConfigModal() {
            document.getElementById(&#39;adminWaInput&#39;).value = adminConfig.waNumber;
            document.getElementById(&#39;adminTaglineInput&#39;).value = adminConfig.tagline;
            document.getElementById(&#39;configSuccessMsg&#39;).classList.add(&#39;hidden&#39;);
            document.getElementById(&#39;configModal&#39;).classList.remove(&#39;hidden&#39;);
        }

        function closeConfigModal() {
            document.getElementById(&#39;configModal&#39;).classList.add(&#39;hidden&#39;);
        }

        function saveAdminConfig() {
            let inputWa = document.getElementById(&#39;adminWaInput&#39;).value.replace(/[^0-9]/g, &#39;&#39;);
            let inputTagline = document.getElementById(&#39;adminTaglineInput&#39;).value.trim();

            if (!inputWa || inputWa.length &lt; 8) {
                showToast(&#39;❌ Masukkan nomor WhatsApp yang valid (contoh: 6281234567890)&#39;);
                return;
            }

            if (!inputTagline) inputTagline = &#39;SMM &amp; Digital Account Services&#39;;

            adminConfig.waNumber = inputWa;
            adminConfig.tagline = inputTagline;

            localStorage.setItem(&#39;arstore_admin_wa&#39;, inputWa);
            localStorage.setItem(&#39;arstore_tagline&#39;, inputTagline);

            updateConfigDisplay();
            
            document.getElementById(&#39;configSuccessMsg&#39;).classList.remove(&#39;hidden&#39;);
            showToast(&#39;✓ Pengaturan ARSTORE berhasil disimpan!&#39;);

            setTimeout(() =&gt; {
                closeConfigModal();
            }, 1200);
        }

        // Toast Alert System
        function showToast(message) {
            const toast = document.getElementById(&#39;toast&#39;);
            document.getElementById(&#39;toastMsg&#39;).textContent = message;
            toast.classList.remove(&#39;translate-x-full&#39;);

            setTimeout(() =&gt; {
                toast.classList.add(&#39;translate-x-full&#39;);
            }, 3000);
        }

        // Initialize Page
        window.addEventListener(&#39;DOMContentLoaded&#39;, () =&gt; {
            document.getElementById(&#39;count-all&#39;).textContent = products.length;
            renderProducts(products);
        });

        // Close Modals on Escape Key
        window.addEventListener(&#39;keydown&#39;, (e) =&gt; {
            if (e.key === &#39;Escape&#39;) {
                closeProductModal();
                closeConfigModal();
            }
        });
    &lt;/script&gt;
